# Alembic configuration for the AI Dermatologist backend.
#
# NOTE: sqlalchemy.url is deliberately EMPTY here. migrations/env.py reads
# DATABASE_URL from the environment (.env) instead, so the database password
# never gets committed. Leaving a URL in this file is how credentials leak.
#
# Usage (always via the .venv interpreter):
#   .venv/Scripts/python.exe -m alembic upgrade head
#   .venv/Scripts/python.exe -m alembic revision --autogenerate -m "message"
#   .venv/Scripts/python.exe -m alembic current
#   .venv/Scripts/python.exe -m alembic downgrade -1

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
